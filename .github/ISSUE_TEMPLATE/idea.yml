name: An idea
description: Something MPE Roll should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you're trying to do in FL Studio, and how MPE Roll could help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround, if there is one, and what's wrong with it.
