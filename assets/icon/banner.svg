<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <!-- README's banner, for dark mode: social.svg's composition, tighter, with no background of its own.
       GitHub's dark themes differ in shade (#0d1117, #212830, #010409), and a background would show as
       a box on each; transparent, the banner sits on whichever the page has. banner-light.svg is its
       light variant. tools/make_icons.py renders it to docs/images/banner-dark.png. The group holds a
       copy of mpe-roll.svg's shapes, scaled to 224 px. -->
  <g transform="translate(232 48) scale(3.5)">
    <rect x="1" y="1" width="62" height="62" rx="14" fill="#16181c" stroke="#363b45" stroke-width="2"/>
    <path d="M2 24.5H62M2 36.5H62M2 48.5H62" fill="none" stroke="#292d35" stroke-width="1"/>
    <rect x="6" y="38" width="30" height="9" rx="4.5" fill="#6fcf97"/>
    <path d="M36 42.5C45 42.5 43 18.5 52 18.5H56" fill="none" stroke="#ffb04a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
    <text x="504" y="160" font-size="104" font-weight="800" letter-spacing="-2.5" fill="#ffffff">MPE Roll</text>
    <text x="508" y="222" font-size="34" font-weight="500" fill="#a9b1bd">An MPE piano roll for FL Studio</text>
  </g>
</svg>
