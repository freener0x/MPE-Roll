<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <!-- The link card (Open Graph and Twitter cards through jekyll-seo-tag, and the repository's social
       preview): the icon, the wordmark and the tagline on ink. tools/make_icons.py renders it to
       docs/images/social.png. The group holds a copy of mpe-roll.svg's shapes, scaled to 360 px. The
       text uses the first font of the list the machine has (Inter where the images were made), so its
       width varies a little from one machine to another; the layout leaves room for that. -->
  <rect width="1280" height="640" fill="#16181c"/>
  <g transform="translate(104 140) scale(5.625)">
    <rect x="1" y="1" width="62" height="62" rx="14" fill="#16181c" stroke="#363b45" stroke-width="2"/>
    <path d="M2 24.5H62M2 36.5H62M2 48.5H62" fill="none" stroke="#292d35" stroke-width="1"/>
    <rect x="6" y="38" width="30" height="9" rx="4.5" fill="#6fcf97"/>
    <path d="M36 42.5C45 42.5 43 18.5 52 18.5H56" fill="none" stroke="#ffb04a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
    <text x="536" y="318" font-size="128" font-weight="800" letter-spacing="-3" fill="#ffffff">MPE Roll</text>
    <text x="540" y="392" font-size="40" font-weight="500" fill="#a9b1bd">The MPE piano roll for FL Studio</text>
  </g>
</svg>
