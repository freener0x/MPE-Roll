# SPDX-License-Identifier: AGPL-3.0-only

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Build the macOS bundles as well
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each build names itself inside the plugin (File menu, MPE settings, plugin log) with the run
# number, the commit and the date, so a tester can tell which build their DAW loaded. For a pull
# request that's the branch's own commit, not the merge commit GitHub builds.
env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # A push that only touches documentation builds nothing.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did anything but documentation change?
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          # A pull request opening, a new branch, a force-push or a manual run has no earlier commit
          # to compare with, so everything is built.
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            printf 'Changed since %s:\n%s\n' "$BEFORE" "$changed"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '(^|/)[^/]*\.md$|^docs/|^LICENSE'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Build the code: $code"

      # docs/MPE_SYNTHS.md and the plugin's list of synths are made from docs/synths.json, so a change
      # to one without the other shows here, documentation-only pushes included.
      - name: The synth list matches docs/synths.json
        run: python3 tools/make_synth_list.py --check

      # The icon's PNGs, .ico files and website images are made from the SVGs in assets/icon by
      # tools/make_icons.py, which needs a browser to render them; --check needs only Python, and
      # says whether what's committed was made from the SVGs that are committed.
      - name: The icon images match assets/icon
        run: python3 tools/make_icons.py --check

      # The files of the plugin's code, tests, tools, build, installer and CI workflows start with
      # MPE Roll's SPDX header (the licence, AGPL-3.0-only, and the copyright); README's License
      # section lists them. Other files, Markdown, JSON and images aside, mustn't have it.
      # tools/check_spdx.py --fix adds a missing header.
      - name: The code, build, installer and CI files start with their SPDX header
        run: python3 tools/check_spdx.py

  windows:
    name: Windows (VST3, Standalone)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      HARNESS: build/MpeRollHarness_artefacts/Release/MpeRollHarness.exe
      VST3_SYNTH: build/MpeRollTestSynth_artefacts/Release/VST3/MPE Roll Test Synth.vst3
      VST2_SYNTH: build/MpeRollTestSynth_artefacts/Release/VST/MPE Roll Test Synth.dll
      PLAIN_VST3_SYNTH: build/MpeRollPlainTestSynth_artefacts/Release/VST3/MPE Roll Plain Test Synth.vst3
      PLAIN_VST2_SYNTH: build/MpeRollPlainTestSynth_artefacts/Release/VST/MPE Roll Plain Test Synth.dll
      FLAKY_SYNTH: build/MpeRollFlakyTestSynth_artefacts/Release/MPE Roll Flaky Test Synth.dll
      CLAP_SYNTH: build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Test Synth.clap
      NOTE_EXPRESSION_SYNTH: build/MpeRollVst3NoteExpressionTestSynth_artefacts/Release/MPE Roll Note Expression Test Synth.vst3
      SCANNER: build/MpeRollScanner_artefacts/Release/MPE Roll Scanner.exe
      CRASHING_PLUGIN: build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Crashing Test Plugin.clap
      HANGING_PLUGIN: build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Hanging Test Plugin.clap
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -A x64 -DMPEROLL_BUILD_DEV_TOOLS=ON
          -DMPEROLL_BUILD_ID="build ${{ github.run_number }}, ${HEAD_SHA::7}, $(date -u +%F)"

      - name: Build
        run: >
          cmake --build build --config Release --parallel --target MpeRoll_VST3 MpeRoll_VST MpeRoll_Standalone
          MpeRollScanner MpeRollTests MpeRollHarness MpeRollTestSynth_VST3 MpeRollTestSynth_VST MpeRollClapTestSynth
          MpeRollPlainTestSynth_VST3 MpeRollPlainTestSynth_VST MpeRollFlakyTestSynth
          MpeRollVst3NoteExpressionTestSynth MpeRollCrashingTestPlugin MpeRollHangingTestPlugin

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Hosting synths on Windows, with the same checks the Linux job runs.
      - name: Plugin self-test
        run: '"$HARNESS" selftest'

      - name: UI interaction test
        run: '"$HARNESS" uitest'

      # The update check against tools/fake_releases_server.py, as in the Linux job, here through
      # WinINet as on users' computers: the headers it sends, the release page's redirect read with
      # redirects off, its 8 s timeout, and a request called off as the window closes. The runner's
      # Python serves it over plain HTTP on this machine; CI never asks GitHub itself (the harness
      # stops before any check if it can't point the check elsewhere). A failure says what WinINet
      # sent and when.
      - name: Update check against a stand-in for GitHub (off by default, once a day, fallback)
        run: '"$HARNESS" updatetest tools/fake_releases_server.py'

      - name: Hosted VST3 synth (parameters, render)
        run: |
          "$HARNESS" params "$VST3_SYNTH"
          "$HARNESS" render "$VST3_SYNTH" render.wav

      - name: Hosted VST2 synth (parameters, render)
        run: |
          "$HARNESS" params "$VST2_SYNTH"
          "$HARNESS" render "$VST2_SYNTH" render-vst2.wav

      - name: Hosted CLAP synth (parameters, render, note expressions)
        run: |
          "$HARNESS" params "$CLAP_SYNTH"
          "$HARNESS" render "$CLAP_SYNTH" render-clap.wav
          "$HARNESS" clapdialect "$CLAP_SYNTH"

      # Windows is where a crashing copy can be caught, so this also checks that one is switched off.
      - name: One copy per note through a synth without MPE (VST3, VST2)
        run: |
          "$HARNESS" copies "$PLAIN_VST3_SYNTH"
          "$HARNESS" copies "$PLAIN_VST2_SYNTH"

      - name: A synth's parameter following the pitch bend isn't a knob tweak to the host (VST3, VST2)
        run: |
          "$HARNESS" bendtweaks "$PLAIN_VST3_SYNTH"
          "$HARNESS" bendtweaks "$PLAIN_VST2_SYNTH"

      # The harness hands the host's MIDI to MPE Roll's own processBlock: this checks the engine, not
      # how a host's All Notes Off reaches MPE Roll's VST3 or VST2. The synth only plays along, and its
      # format changes nothing here, so one run is enough.
      - name: The host's All Notes Off and notes stop or gate the clip (Follow FL, Note trigger)
        run: |
          "$HARNESS" gatetest "$PLAIN_VST3_SYNTH"

      - name: Hosted VST3 synth that takes MPE only as VST3 note expressions
        run: |
          "$HARNESS" render "$NOTE_EXPRESSION_SYNTH" render-vst3-note-expressions.wav
          "$HARNESS" vst3dialect "$NOTE_EXPRESSION_SYNTH" "$VST3_SYNTH"

      # The maker name MPE Roll's own plugins give a host: as listed (a VST3 from its moduleinfo.json
      # alone), as loaded (the VST3's factory, the VST2's vendor string), and every vendor in the
      # VST3's moduleinfo.json. COMPANY_NAME in CMakeLists.txt, "MPE Roll".
      - name: MPE Roll's VST3 and VST2 give their maker as MPE Roll
        run: >
          "$HARNESS" makername "build/MpeRoll_artefacts/Release/VST3/MPE Roll.vst3"
          "build/MpeRoll_artefacts/Release/VST/MPE Roll.dll"

      - name: Export the clip as WAV and MP3 (VST3 synth)
        run: '"$HARNESS" export "$VST3_SYNTH" exported'

      # The standalone app's crash report: the harness installs it and crashes on purpose.
      - name: Crash report names the crash and the function
        run: |
          if "$HARNESS" crashtest crash-report.txt; then echo "The harness didn't crash"; exit 1; fi
          cat crash-report.txt
          grep -q "access violation" crash-report.txt
          grep -q "It tried to write to address 0x0" crash-report.txt
          grep -q "running the crash test" crash-report.txt
          grep -q "crashOnPurpose" crash-report.txt
          if "$HARNESS" crashtest overflow-report.txt overflow; then echo "The harness didn't overflow"; exit 1; fi
          cat overflow-report.txt
          grep -q "a stack overflow" overflow-report.txt
          grep -q "overflowOnPurpose" overflow-report.txt

      - name: Plugin files are looked at in the scanner process (crashing and hanging ones too)
        run: '"$HARNESS" scantest "$SCANNER" "$VST3_SYNTH" "$CRASHING_PLUGIN" "$HANGING_PLUGIN"'

      - name: A failed load says why (Windows' reason, or the step the scanner found failing)
        run: '"$HARNESS" loadfailtest "$SCANNER" "$VST3_SYNTH" "$VST2_SYNTH" "$FLAKY_SYNTH"'

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse -Force "build/MpeRoll_artefacts/Release/VST3/MPE Roll.vst3" dist/   # -Force: the hidden Plugin.ico and desktop.ini too
          if (-not (Test-Path "dist/MPE Roll.vst3/Contents/x86_64-win/MPE Roll Scanner.exe")) { throw "The scanner isn't in the VST3 bundle" }
          Copy-Item "build/MpeRoll_artefacts/Release/VST/MPE Roll.dll" dist/
          Copy-Item "build/MpeRollScanner_artefacts/Release/MPE Roll Scanner.exe" dist/
          Copy-Item "build/MpeRoll_artefacts/Release/Standalone/MPE Roll.exe" dist/
          Copy-Item "build/MpeRoll_artefacts/Release/Standalone/MPE Roll.pdb" dist/
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - uses: actions/upload-artifact@v7
        with:
          name: MPE-Roll-Windows-build-${{ github.run_number }}
          path: dist

      # The installer, made with Inno Setup from the files just packaged (installer/MpeRoll.iss).
      - name: Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { throw "Inno Setup couldn't be installed" }
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(MPE_ROLL VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $buildName = "build ${{ github.run_number }}, $($env:HEAD_SHA.Substring(0, 7)), $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))"
          & $iscc /Qp "/DDistDir=$PWD\dist" "/DAppVersion=$version" "/DBuildNumber=${{ github.run_number }}" `
            "/DBuildName=$buildName" "/DOutputName=MPE-Roll-Setup-build-${{ github.run_number }}" installer\MpeRoll.iss
          if ($LASTEXITCODE) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Installer installs, upgrades, removes older copies and uninstalls
        shell: pwsh
        run: ./installer/test-installer.ps1 -Setup "installer/output/MPE-Roll-Setup-build-${{ github.run_number }}.exe" -Dist dist

      - uses: actions/upload-artifact@v7
        with:
          name: MPE-Roll-Windows-Setup-build-${{ github.run_number }}
          path: installer/output/MPE-Roll-Setup-build-${{ github.run_number }}.exe
          compression-level: 0

  macos:
    name: macOS (VST3, AU, Standalone)
    needs: changes
    # Built for every code change; Run workflow can leave it out.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: brew list ninja || brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DMPEROLL_BUILD_ID="build ${{ github.run_number }}, ${HEAD_SHA::7}, $(date -u +%F)"

      - name: Build
        run: cmake --build build --parallel --target MpeRoll_VST3 MpeRoll_AU MpeRoll_Standalone MpeRollTests

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # An ad-hoc signature (identity "-", no certificate) on the three bundles: where the linker
      # signed only the arm64 half of each binary, this signs each bundle whole, both halves with
      # its Info.plist and resources. That meets Apple silicon's rule that arm64 code be signed, and
      # nothing more: it names no developer and isn't notarized, so Gatekeeper still warns about a
      # download (docs/UNSIGNED_BUILDS.md says what to do). A failing codesign stops the job.
      - name: Sign (ad hoc)
        run: |
          for bundle in "build/MpeRoll_artefacts/Release/VST3/MPE Roll.vst3" \
                        "build/MpeRoll_artefacts/Release/AU/MPE Roll.component" \
                        "build/MpeRoll_artefacts/Release/Standalone/MPE Roll.app"; do
            codesign --force --deep -s - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      # Apple's AU validator, on the component as signed above: an instrument (aumu) with the plugin
      # and maker codes from CMakeLists.txt (Mpr1, Glpk). auval looks in the plug-in folders only,
      # so a copy goes into the user's one for the check and is removed again. macOS has no timeout
      # command; perl's alarm survives the exec and ends auval after 180 s (exit 142) if it hangs.
      # The registrar is restarted first in case it holds a cached list (harmless if it isn't
      # running).
      - name: AU validation (auval)
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          cp -R "build/MpeRoll_artefacts/Release/AU/MPE Roll.component" "$components/"
          killall -9 AudioComponentRegistrar 2> /dev/null || true
          status=0
          perl -e 'alarm shift; exec @ARGV' 180 auval -v aumu Mpr1 Glpk || status=$?
          rm -rf "$components/MPE Roll.component"
          if [ "$status" = 142 ]; then echo "auval didn't finish within 180 s."; fi
          exit "$status"

      # Artifacts lose file permissions, which would leave the app's executable without its
      # executable bit. ditto zips the bundles with their permissions kept.
      - name: Package
        run: |
          mkdir -p "MPE Roll"
          cp -R "build/MpeRoll_artefacts/Release/VST3/MPE Roll.vst3" "MPE Roll/"
          cp -R "build/MpeRoll_artefacts/Release/AU/MPE Roll.component" "MPE Roll/"
          cp -R "build/MpeRoll_artefacts/Release/Standalone/MPE Roll.app" "MPE Roll/"
          ditto -c -k --keepParent "MPE Roll" MPE-Roll-bundles.zip
          ditto -x -k MPE-Roll-bundles.zip unzipped
          test -x "unzipped/MPE Roll/MPE Roll.app/Contents/MacOS/MPE Roll"

      - uses: actions/upload-artifact@v7
        with:
          name: MPE-Roll-macOS-build-${{ github.run_number }}
          path: MPE-Roll-bundles.zip
          compression-level: 0

  linux:
    name: Linux (tests and end-to-end harness)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMPEROLL_BUILD_DEV_TOOLS=ON
          -DMPEROLL_BUILD_ID="build ${{ github.run_number }}, ${HEAD_SHA::7}, $(date -u +%F)"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # The same tests under AddressSanitizer, which catches memory errors Linux's allocator lets pass
      # (a test once read a vector that had already been freed, and only macOS noticed).
      - name: Unit tests under AddressSanitizer
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMPEROLL_BUILD_PLUGIN=OFF -DMPEROLL_MP3=OFF \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src" -DFETCHCONTENT_SOURCE_DIR_CLAP="$PWD/build/_deps/clap-src" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
          cmake --build build-asan --parallel --target MpeRollTests
          ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build-asan --output-on-failure

      - name: Plugin self-test
        run: xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness selftest

      - name: UI interaction test
        run: xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness uitest

      - name: Synth parameters exposed for automation
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness params
          "build/MpeRollTestSynth_artefacts/Release/VST3/MPE Roll Test Synth.vst3"

      - name: Render through a hosted MPE synth
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness render
          "build/MpeRollTestSynth_artefacts/Release/VST3/MPE Roll Test Synth.vst3" render.wav

      - name: Render through a hosted VST2 synth
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness render
          "build/MpeRollTestSynth_artefacts/Release/VST/libMPE Roll Test Synth.so" render-vst2.wav

      - name: VST2 synth parameters exposed for automation
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness params
          "build/MpeRollTestSynth_artefacts/Release/VST/libMPE Roll Test Synth.so"

      - name: Render through a hosted CLAP synth (pitch only from note expressions)
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness render
          "build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Test Synth.clap" render-clap.wav

      - name: CLAP synth parameters exposed for automation
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness params
          "build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Test Synth.clap"

      - name: CLAP note expressions switch on and off
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness clapdialect
          "build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Test Synth.clap"

      - name: One copy per note through a synth without MPE (VST3, VST2)
        run: |
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness copies \
            "build/MpeRollPlainTestSynth_artefacts/Release/VST3/MPE Roll Plain Test Synth.vst3"
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness copies \
            "build/MpeRollPlainTestSynth_artefacts/Release/VST/libMPE Roll Plain Test Synth.so"

      - name: A synth's parameter following the pitch bend isn't a knob tweak to the host (VST3, VST2)
        run: |
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness bendtweaks \
            "build/MpeRollPlainTestSynth_artefacts/Release/VST3/MPE Roll Plain Test Synth.vst3"
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness bendtweaks \
            "build/MpeRollPlainTestSynth_artefacts/Release/VST/libMPE Roll Plain Test Synth.so"

      # The harness hands the host's MIDI to MPE Roll's own processBlock: this checks the engine, not
      # how a host's All Notes Off reaches MPE Roll's VST3 or VST2. The synth only plays along, and its
      # format changes nothing here, so one run is enough.
      - name: The host's All Notes Off and notes stop or gate the clip (Follow FL, Note trigger)
        run: |
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness gatetest \
            "build/MpeRollPlainTestSynth_artefacts/Release/VST3/MPE Roll Plain Test Synth.vst3"

      # A VST3 gets a host's MIDI controllers only as changes of the parameters it maps them to
      # (IMidiMapping), which is how JUCE's VST3 host sends them: MPE Roll's own VST3, loaded that
      # way, must stop its clip for an All Notes Off. Whether FL sends controllers so isn't shown here.
      - name: MPE Roll's VST3 stops for an All Notes Off sent through its controller mapping
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness vst3hostmidi
          "build/MpeRoll_artefacts/Release/VST3/MPE Roll.vst3"

      - name: MPE Roll's VST3 gives its maker as MPE Roll
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness makername
          "build/MpeRoll_artefacts/Release/VST3/MPE Roll.vst3"

      # A VST3 synth that maps pitch bend on MIDI channel 1 only (JUCE's VST3 host drops MPE's bends on
      # the other channels) but takes VST3 note expressions: its notes glide only if MPE Roll sends them.
      - name: Render through a VST3 synth that takes MPE only as VST3 note expressions
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness render
          "build/MpeRollVst3NoteExpressionTestSynth_artefacts/Release/MPE Roll Note Expression Test Synth.vst3"
          render-vst3-note-expressions.wav

      - name: VST3 note expressions, pressure, and switching them on and off
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness vst3dialect
          "build/MpeRollVst3NoteExpressionTestSynth_artefacts/Release/MPE Roll Note Expression Test Synth.vst3"
          "build/MpeRollTestSynth_artefacts/Release/VST3/MPE Roll Test Synth.vst3"

      - name: Export the clip as WAV and MP3 (VST3, VST2 and CLAP synths)
        run: |
          for synth in "build/MpeRollTestSynth_artefacts/Release/VST3/MPE Roll Test Synth.vst3" \
                       "build/MpeRollTestSynth_artefacts/Release/VST/libMPE Roll Test Synth.so" \
                       "build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Test Synth.clap"; do
            xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness export "$synth" exported
          done

      - name: Plugin files are looked at in the scanner process (crashing and hanging ones too)
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness scantest
          "build/MpeRollScanner_artefacts/Release/MPE Roll Scanner"
          "build/MpeRollTestSynth_artefacts/Release/VST3/MPE Roll Test Synth.vst3"
          "build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Crashing Test Plugin.clap"
          "build/MpeRollClapTestSynth_artefacts/Release/MPE Roll Hanging Test Plugin.clap"

      - name: A failed load says why (the system's reason, or the step the scanner found failing)
        run: >
          xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness loadfailtest
          "build/MpeRollScanner_artefacts/Release/MPE Roll Scanner"
          "build/MpeRollTestSynth_artefacts/Release/VST3/MPE Roll Test Synth.vst3"
          "build/MpeRollTestSynth_artefacts/Release/VST/libMPE Roll Test Synth.so"
          "build/MpeRollFlakyTestSynth_artefacts/Release/MPE Roll Flaky Test Synth.so"

      # The update check against tools/fake_releases_server.py, a stand-in for GitHub run with
      # Python on this machine over plain HTTP: this build has no TLS, and CI never asks GitHub
      # itself. Nothing sent while the check is off, once a day when on, the release page when the
      # API refuses or doesn't answer, never a pre-release, failures said only when asked, two MPE
      # Rolls running at once going by the same file, a check called off when switched off, and a
      # request under way called off as the window closes. The Windows job runs it through WinINet.
      - name: Update check against a stand-in for GitHub (off by default, once a day, fallback)
        run: xvfb-run -a build/MpeRollHarness_artefacts/Release/MpeRollHarness updatetest tools/fake_releases_server.py

      # The same build for people who'd try MPE Roll in a Linux host (FL Studio has none, and no
      # Linux host has run it): the VST3 with the scanner inside, the standalone app and the
      # scanner, in a tar so the executable bits survive the artifact. The release attaches it as
      # experimental.
      - name: Package
        run: |
          mkdir -p "MPE Roll"
          cp -R "build/MpeRoll_artefacts/Release/VST3/MPE Roll.vst3" "MPE Roll/"
          cp "build/MpeRoll_artefacts/Release/Standalone/MPE Roll" "MPE Roll/"
          cp "build/MpeRollScanner_artefacts/Release/MPE Roll Scanner" "MPE Roll/"
          if [ ! -x "MPE Roll/MPE Roll.vst3/Contents/x86_64-linux/MPE Roll Scanner" ]; then echo "The scanner isn't in the VST3 bundle"; exit 1; fi
          tar -czf MPE-Roll-Linux.tar.gz "MPE Roll"
          tar -tzvf MPE-Roll-Linux.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: MPE-Roll-Linux-build-${{ github.run_number }}
          path: MPE-Roll-Linux.tar.gz
          compression-level: 0

  # The website (docs/), built as GitHub Pages builds it after a merge to main: Jekyll with the
  # Cayman theme. Built for every change, documentation included, since that's what it's made of.
  site:
    name: Website (docs/, as GitHub Pages builds it)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Its pages are there, and load nothing from other sites
        run: |
          ls _site/index.html _site/donate.html _site/share.html _site/MPE_IN_FL_STUDIO.html \
            _site/FL_STUDIO.html _site/MPE_SYNTHS.html _site/UNSIGNED_BUILDS.html _site/KNOWN_ISSUES.html \
            _site/PRIVACY.html _site/assets/css/style.css _site/sitemap.xml
          if grep -rlE 'fonts\.(googleapis|gstatic)\.com' _site; then
            echo "These load fonts from Google"
            exit 1
          fi

      # Every picture, clip, script, stylesheet and icon the pages load is the site's own, and every
      # link into the site (pages, pictures, #places on a page) leads to something that's there.
      # What the site tells search engines holds too: the front page's software data and every
      # page's own are JSON that names nothing missing, sitemap.xml lists only pages that are
      # there, at the site's address, and no two pages have the same description.
      - name: Nothing loaded from elsewhere, no link into the site leading nowhere
        run: python3 tools/check_site.py _site
