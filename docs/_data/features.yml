community:
  title: Community
  text: >-
    MPE Roll is made in the open, on GitHub. Questions, problems and ideas go in an issue: pick the
    form that fits.
  # The issue forms in .github/ISSUE_TEMPLATE, by file name.
  forms:
    - title: A synth won't load
      template: synth-wont-load.yml
    - title: No sound, or expression that doesn't reach the synth
      template: no-sound-or-expression.yml
    - title: Something else is wrong
      template: bug.yml
    - title: An idea
      template: idea.yml
  report: >-
    In MPE Roll, *File › Report a bug…* opens the form with the build and your system filled in,
    and puts the plugin log on the clipboard to paste into it.
  synths: >-
    Found a mistake in the [list of synths](MPE_SYNTHS.html), or an instrument that's missing?
    Please open an issue.
  testers: >-
    Nobody has run the macOS build yet, nor the Linux build in a Linux host. If you do, please say
    how it went, working or not.
  # true once Discussions are switched on in the repository's settings: the page then links them.
  discussions: false

share:
  title: Spread the word
  text: >-
    If MPE Roll is useful to you, telling people about it helps. The [share page](share.html) has
    posts about it ready for X, Facebook and Instagram, each with this site's address.
  button: Share MPE Roll

support:
  title: Support MPE Roll
