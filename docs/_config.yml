# MPE Roll's website: GitHub Pages builds it with Jekyll from this folder (Settings > Pages: the
# main branch, folder /docs), in GitHub's Cayman theme. tools/make_donate_page.py writes index.html,
# donate.html and _data/project.yml; FL_STUDIO.md, MPE_SYNTHS.md, KNOWN_ISSUES.md, UNSIGNED_BUILDS.md
# and PRIVACY.md become pages as they are.
# _layouts/default.html and _sass/jekyll-theme-cayman.scss are Cayman's own (CC0), changed so the
# site loads nothing from other sites (Cayman takes its font from Google Fonts) and links its pages.

title: MPE Roll
description: An MPE piano roll for FL Studio. Load your synth inside it, and every note gets its own pitch glide, pressure and timbre.
lang: en
theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag

# For jekyll-seo-tag: the site's logo, and the link card (og:image, Twitter's card) every page gets.
# Both are made by tools/make_icons.py; the repository's own social preview is the same social.png,
# uploaded by hand under the repository's Settings > General > Social preview.
logo: /images/icon-512.png
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /images/social.png
        width: 1280
        height: 640
        alt: "MPE Roll"

# The guides are published as pages only, not also as the .md files they're made from.
optional_front_matter:
  remove_originals: true
